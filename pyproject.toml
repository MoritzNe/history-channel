[project]
name = "historychannel"
version = "0.1.0"
description = "Script-first pipeline that turns a researched history script into a narrated YouTube video."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.7",
    "requests>=2.32",
    "pillow>=10.4",
    "numpy>=1.26",
    "soundfile>=0.12",
    "matplotlib>=3.9",
    "geopandas>=1.0",
    "shapely>=2.0",
    "kokoro-onnx>=0.4",
    "anthropic>=0.40",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "python-dotenv>=1.0",
    "skia-python>=144.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
hc = "historychannel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/historychannel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test hits the network (Wikimedia, model downloads)",
    "slow: test takes more than a few seconds",
]
